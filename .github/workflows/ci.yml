name: AZHottie Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  php:
    name: PHP syntax and specialist rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite
          coverage: none
      - name: Lint PHP application and test files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l
      - name: Test agent specialist rules
        run: |
          php tests/agent_casting_rules.php
          php tests/agent_followthrough_rules.php
          php tests/live_agent_rules.php
          php tests/agent_scheduling_rules.php
          php tests/agent_video_rules.php
          php tests/agent_video_integration.php
          php tests/agent_publishing_rules.php
          php tests/agent_publishing_integration.php
          php tests/commerce_integration.php
          php tests/commerce_stripe_integration.php
          php tests/commerce_local_integration.php
          php tests/commerce_fulfillment_integration.php
          php tests/commerce_carrier_integration.php
          php tests/commerce_smart_shipping_integration.php
          php tests/commerce_returns_settlement_integration.php
          php tests/commerce_provider_pure.php
          php tests/commerce_provider_readiness.php
          php tests/commerce_provider_triage.php
          php tests/commerce_agent_rules.php
          php tests/commerce_agent_sql.php
          php tests/commerce_provider_integration.php
          php tests/admin-command-v141.php
          php tests/admin-intelligence-v142.php
          php tests/admin-action-v143.php
          php tests/admin-coordination-v144.php
          php tests/admin-ops-learning-v145.php
          php tests/live-phone-reset-v146.php
          php tests/live-acceptance-v147.php
          php tests/live-triage-v148.php
          php tests/live-viewer-order-v149.php
          php tests/creator-analytics-v150.php
          php tests/publishing-campaign-v153.php
          php tests/talent-pipeline-v154.php
          php tests/creator-club-v155.php
          php tests/shop-v156.php
          php tests/shop-homepage-v157.php
          php tests/shop-homepage-v158.php
          php tests/admin-navigation-v1571.php

  fixtures:
    name: SQLite permissions and migration fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python tests/agent_casting_sql_fixture.py
          python tests/agent_followthrough_sql_smoke.py
          python tests/live_agent_sql_smoke.py
          python tests/agent_scheduling_sql_smoke.py
          python tests/agent_video_sql_smoke.py
          python tests/agent_publishing_sql_smoke.py
          python tests/commerce_sql_smoke.py
          python tests/commerce_local_sql_smoke.py
          python tests/commerce_fulfillment_sql_smoke.py
          python tests/commerce_carrier_sql_smoke.py
          python tests/commerce_smart_shipping_sql_smoke.py
          python tests/commerce_returns_sql_smoke.py
          python tests/commerce_provider_sql_smoke.py

  commerce-browser:
    name: Commerce responsive browser acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring
          coverage: none
      - run: |
          python -m pip install playwright==1.58.0
          google-chrome --version
      - run: |
          python tests/commerce_browser.py
          python tests/commerce_local_browser.py
          python tests/commerce_fulfillment_browser.py
          python tests/commerce_carrier_browser.py
          python tests/commerce_smart_shipping_browser.py
          python tests/commerce_returns_browser.py
          python tests/commerce_provider_browser.py
          python tests/commerce_readiness_browser.py
          python tests/commerce_provider_triage_browser.py
          python tests/commerce_agent_browser.py
          python tests/admin-command-browser.py
          python tests/admin-intelligence-browser.py
          python tests/admin-action-browser.py
          python tests/admin-coordination-browser.py
          python tests/admin-ops-learning-browser.py
          python tests/live-recovery-browser.py
          python tests/live-acceptance-browser.py
          python tests/live-triage-browser.py
          python tests/live-v149-browser.py
          python tests/live-v151-browser.py
          python tests/publishing-campaign-v153-browser.py
          python tests/talent-pipeline-v154-browser.py
          python tests/creator-club-v155-browser.py
          python tests/shop-v156-browser.py
          python tests/shop-homepage-v157-browser.py
          python tests/shop-homepage-v158-browser.py
          python tests/shop-hero-v1571-browser.py
          python tests/admin-navigation-v1571-browser.py
          python tests/live-shopping-v141-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commerce-browser-screenshots
          path: |
            ${{ runner.temp }}/azh_commerce_browser/*.png
            ${{ runner.temp }}/azh_cash_browser/*.png
            ${{ runner.temp }}/azh_shipping_browser/*.png
            ${{ runner.temp }}/azh_carrier_browser/*.png
            ${{ runner.temp }}/azh_smart_shipping_browser/*.png
            ${{ runner.temp }}/azh_returns_browser/*.png
            ${{ runner.temp }}/azh_provider_browser/*.png
            ${{ runner.temp }}/azh_readiness_browser/*.png
            ${{ runner.temp }}/azh_triage_browser/*.png
            ${{ runner.temp }}/azh_commerce_agent_browser/*.png
            ${{ runner.temp }}/azh_admin_command_browser/*.png
            ${{ runner.temp }}/azh_admin_intelligence_browser/*.png
            ${{ runner.temp }}/azh_admin_action_browser/*.png
            ${{ runner.temp }}/azh_coordination_browser/*.png
            ${{ runner.temp }}/azh_ops_learning_browser/*.png
            ${{ runner.temp }}/azh_live_recovery_browser/*.png
            ${{ runner.temp }}/azh_live_acceptance_browser/*.png
            ${{ runner.temp }}/azh_live_triage_browser/*.png
            ${{ runner.temp }}/azh_live_v149_browser/*.png
            ${{ runner.temp }}/azh_live_v151_browser/*.png
            ${{ runner.temp }}/azh_live_shop_v141/*.png
            ${{ runner.temp }}/azh_shop_v157_browser/*.png
            ${{ runner.temp }}/azh_shop_v158_browser/
            ${{ runner.temp }}/azh_shop_v1571_browser/*.png
            ${{ runner.temp }}/azh_admin_navigation_v1571/*.png
            ${{ runner.temp }}/azh_campaign_v153_browser/*.png
            ${{ runner.temp }}/azh_talent_v154_browser/*.png
          if-no-files-found: ignore
          retention-days: 14

  deployment:
    name: Build safe deployment archive
    runs-on: ubuntu-latest
    needs: [javascript, php, fixtures, commerce-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_deploy.py
      - uses: actions/upload-artifact@v4
        with:
          name: azhottie-studio-deploy
          path: dist/AZHottie_Studio_Full_Deploy.zip
          if-no-files-found: error
          retention-days: 14

